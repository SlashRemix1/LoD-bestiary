function setScrollLed() {
	if(window.ActiveXObject) {

	for(var i=0; i<arrLed.length; i++) {
		str += "<span style=\"color:#ffa717;\">"+ arrLed[i].Category +"</span>&nbsp;<span style=\"color:#fff;\">"+ arrLed[i].Content +"</span>&nbsp;";

	document.getElementById("led_text").innerHTML = str;
}
function scrollLed() {
	var obj = document.getElementById('led_text');
	obj.style.left = parseInt(obj.style.left)-4 + "px";
	if(parseInt(obj.style.left)+obj.offsetWidth<0) obj.style.left = 600 +"px";
	window.setTimeout("scrollLed()", 100);
}
